<style>

:root[data-theme="dark"]{--bg:#0b121b;--card:#152130;--tx:#e9f1f9;--mu:#9bacbf;--pr:#4a9cf0;--ok:#3ccf92;--wa:#f5c15a;--ln:#27384d;--c1:#1a2a3d;--c2:#101a27;--sh:0 8px 28px rgba(0,0,0,.4)}

</style></head><body><header class="top"><div class="tools"><button class="mt" id="mt" onclick="tgM()"></button><button class="mt" id="mu" onclick="tgMu()"></button><button class="mt" id="ms" onclick="setMs((msi+1)%MS.length)"></button></div><h1>GUANTE <b>REHAB</b></h1><p>Rehabilitación de mano · Juegos terapéuticos</p></header><div class="wrap">
<section id="v"></section>
<section class="card"><h3>Sensores</h3><div id="bars"></div>
<div class="mu" id="hint" style="font-size:14px"></div>

<button class="btn s" onclick="cWS()">WiFi</button><button class="btn s" onclick="cUSB()">USB</button><button class="btn s" onclick="setMode('demo')">Demo</button></div>
<div class="mu" id="st" style="font-size:14px;margin-top:6px"></div></section>
</div>
<script>
const $=s=>document.querySelector(s),clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const NAMES=['Pulgar','Índice','Medio','Anular'];
let lastRx=0,lastM='',raw=[0,0,0,0],f=[0,0,0,0],sl=[0,0,0,0],kv=[0,0,0,0],keys={},mode='demo',cur=null,cv=null,C={},ws=null;
const PKS=['gr_ses','gr_pat','gr_goal','gr_ach','gr_cal_demo','gr_cal_wifi','gr_cal_usb'];
let PID=(()=>{try{return localStorage.getItem('gr_pid')||'p1'}catch(e){return 'p1'}})();
const pk=k=>PKS.includes(k)&&PID!=='p1'?k+'_'+PID:k;
function load(k,d){try{return JSON.parse(localStorage.getItem(pk(k)))||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(pk(k),JSON.stringify(v))}catch(e){}}
const defCal=m=>({min:[0,0,0,0],max:m==='demo'?[100,100,100,100]:[350,350,350,350],done:false});
let cal=load('gr_cal_demo',defCal('demo'));
const st=t=>$('#st').textContent=t;
function setMode(m){mode=m;lastM='';cal=load('gr_cal_'+m,defCal(m));
 document.querySelectorAll('.sr input').forEach(e=>e.style.display=m==='demo'?'':'none');
 $('#hint').textContent=m==='demo'?'Demo: usa los deslizadores, o las teclas 1-5 (dedos) y ESPACIO (puño).':'Guante conectado por '+(m==='wifi'?'WiFi':'USB')+'.';
 st(m==='demo'?'Modo demo':'Conectado ✓');if(!cur)home()}
function setRaw(a){if(a.length>=4&&a.slice(0,4).every(isFinite)){raw=a.slice(0,4).map(Number);lastRx=Date.now()}}
function parse(t){t=t.trim();let a;try{const j=JSON.parse(t);a=Array.isArray(j)?j:j&&j.f}catch(e){a=t.split(/[,; \t]+/)}
 if(a&&a.length>=4&&a.slice(0,4).every(x=>x!==''&&x!==null&&isFinite(x))){setRaw(a.map(Number));return}
 if(/http|->/.test(t))return;const m=t.match(/-?\d+(?:\.\d+)?/g);if(m)setRaw(m.map(Number))}
function cWS(){try{ws&&ws.close();st('Conectando…');ws=new WebSocket($('#url').value);
 ws.onopen=()=>setMode('wifi');ws.onmessage=e=>parse(String(e.data));
 ws.onclose=()=>{if(mode==='wifi')setMode('demo')};ws.onerror=()=>st('No se pudo conectar (¿abriste esta página desde el ESP32?)')}catch(e){st('Dirección no válida')}}
async function cUSB(){
 if(!navigator.serial){st('Este navegador no permite USB. Usa Chrome o Edge en un computador.');return}
 let p;try{p=await navigator.serial.requestPort()}catch(e){st('No elegiste ningún puerto USB.');return}
 try{await p.open({baudRate:115200})}catch(e){st('No se pudo abrir el puerto. Cierra el Monitor Serial u otros programas que lo usen y reintenta. '+(e.message||''));return}
 setMode('usb');
 try{const r=p.readable.pipeThrough(new TextDecoderStream()).getReader();let b='';
  for(;;){const{value,done}=await r.read();if(done)break;b+=value;let k;while((k=b.indexOf('\n'))>=0){parse(b.slice(0,k));b=b.slice(k+1)}}}catch(e){st('Se perdió la conexión USB.')}
 if(mode==='usb')setMode('demo')}
// barras + deslizadores
$('#bars').innerHTML=NAMES.map((n,i)=>`<div class="sr"><span>${n}</span><div><div class="m"><i id="b${i}"></i></div><input type="range" min="0" max="100" value="0" oninput="sl[${i}]=+this.value" aria-label="${n}"></div></div>`).join('');
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='text')return;keys[e.key]=1;if(e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=0);
function input(){if(mode!=='demo'){const m=Date.now()-lastRx<1500?'Conectado ✓ recibiendo datos':'Conectado, pero no llegan datos (revisa 115200 baudios y que envíe 4 números por línea)';if(m!==lastM){lastM=m;st(m)}}
 if(mode==='demo'){for(let i=0;i<4;i++){kv[i]+=((keys[i+1]||keys[' ']?100:0)-kv[i])*.15;raw[i]=Math.max(sl[i],kv[i])}}
 for(let i=0;i<4;i++){const d=((cal.max[i]-cal.min[i])*.92)||1;f[i]+=(clamp((raw[i]-cal.min[i])/d)-f[i])*.5;$('#b'+i).style.width=f[i]*100+'%'}}
const avg=()=>f.reduce((a,b)=>a+b,0)/4;
function cols(){const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue('--'+n).trim();C={bg:g('card'),tx:g('tx'),mu:g('mu'),pr:g('pr'),ok:g('ok'),wa:g('wa'),ln:g('ln')}}
function T(c,s,x,y,sz,col,al='center',w=700){c.font=`${w} ${sz*(xl?1.15:1)}px system-ui,sans-serif`;c.fillStyle=col;c.textAlign=al;c.fillText(s,x,y)}
function orb(c,x,y,r,col){const g=c.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);g.addColorStop(0,'#ffffffcc');g.addColorStop(.4,col);g.addColorStop(1,col);c.save();c.shadowColor=col;c.shadowBlur=r*.6;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore()}
function seg(c,x1,y1,x2,y2,w1,w2){const a=Math.atan2(y2-y1,x2-x1);c.beginPath();c.arc(x1,y1,w1/2,a+Math.PI/2,a-Math.PI/2);c.arc(x2,y2,w2/2,a-Math.PI/2,a+Math.PI/2);c.closePath();c.fill();c.stroke()}
function hand(c,x,y,s){const SK='#e9bd9b',SD='#b0795a',R=Math.PI/180;c.save();c.lineJoin='round';c.lineWidth=1.6*s;c.strokeStyle=SD;
 c.fillStyle=C.pr;c.beginPath();c.roundRect(x-50*s,y+86*s,100*s,38*s,10*s);c.fill();c.fillStyle='#ffffff55';c.fillRect(x-50*s,y+97*s,100*s,5*s);
 let g=c.createLinearGradient(x-50*s,y,x+50*s,y+95*s);g.addColorStop(0,'#f2cdae');g.addColorStop(1,'#d9a584');
 c.fillStyle=g;c.beginPath();c.roundRect(x-52*s,y-4*s,104*s,96*s,[14*s,14*s,36*s,36*s]);c.fill();c.stroke();
 c.strokeStyle='#c4916d';c.beginPath();c.moveTo(x-38*s,y+44*s);c.quadraticCurveTo(x,y+62*s,x+44*s,y+38*s);c.moveTo(x-30*s,y+62*s);c.quadraticCurveTo(x,y+74*s,x+30*s,y+60*s);c.stroke();
 const dot=(px,py,v)=>{c.fillStyle=v>.7?C.ok:C.pr;c.strokeStyle='#fff';c.lineWidth=1.5*s;c.beginPath();c.arc(px,py,4.2*s,0,7);c.fill();c.stroke()};
 const F=[[-37,[38,24,19],21],[-12.5,[42,27,21],22],[12.5,[39,25,20],21],[36,[31,20,17],18]];
 F.forEach(([bx,L,w],k)=>{const v=f[Math.min(k+1,3)],ph=[80,180,250].map(d=>d*v*R),t=1+.12*v,px=x+bx*s;let py=y+2*s,k1=0;
  for(let j=0;j<3;j++){const ny=py-L[j]*s*Math.cos(ph[j]),w1=w*s*t*(1-j*.08),w2=w*s*t*(1-(j+1)*.08);
   c.strokeStyle=SD;c.lineWidth=1.6*s;c.fillStyle=SK;seg(c,px,py,px,ny,w1,w2);
   if(j===2&&v<.5){c.fillStyle='#f8e3d3';c.beginPath();c.ellipse(px,ny+7*s,w2*.32,6*s,0,0,7);c.fill()}
   if(j<2){c.strokeStyle='#c4916d';c.lineWidth=s;c.beginPath();c.moveTo(px-w2*.3,ny);c.lineTo(px+w2*.3,ny);c.stroke()}
   if(j===0)k1=ny;py=ny}
  dot(px,k1,v)});
 {const v=f[0];let px=x-46*s,py=y+58*s;c.strokeStyle=SD;c.lineWidth=1.6*s;
  [[36,45,25,21],[30,95,21,18]].forEach(([L,d,w1,w2],j)=>{const a=(-140+v*d)*R,nx=px+Math.cos(a)*L*s,ny=py+Math.sin(a)*L*s;c.fillStyle=SK;seg(c,px,py,nx,ny,w1*s,w2*s);
   if(j===1&&v<.5){c.fillStyle='#f8e3d3';c.beginPath();c.ellipse(nx-Math.cos(a)*4*s,ny-Math.sin(a)*4*s,5.5*s,6.5*s,a+Math.PI/2,0,7);c.fill()}
   if(j===0)dot(nx,ny,v);px=nx;py=ny})}
 c.restore()}
const LVN=['Inicial','Básico','Intermedio','Avanzado','Experto'],ICON={fruit:'<circle cx="12" cy="14" r="6.5"/><path d="M12 7.5c0-2 1-3.5 3-4.5M12 8c-1.5-1.5-3.5-1.5-5-.5"/>',fist:'<path d="M7 12V8a1.5 1.5 0 013 0V7a1.5 1.5 0 013 0v1a1.5 1.5 0 013 0v5c0 4-2 7-6 7s-6-3-6-6z"/>',rhythm:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',hold:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',pinza:'<path d="M5 20c0-6 3-9 7-9m7 9c0-6-3-9-7-9"/><circle cx="12" cy="6" r="2.5"/>',seq:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'},G={};let lvl=clamp(load('gr_lvl',1),1,5),dgoal=load('gr_goal',3);const P=a=>a[lvl-1];
const dk=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>dk(new Date());
// ---------- CALIBRACIÓN ----------
G.calib={name:'Calibración',init(){this.ph=0;this.t=0;this.acc=[0,0,0,0];this.n=0;this.v=[]},
 step(dt,c){this.t+=dt;const pre=4;
  T(c,this.ph?'Cierra el puño con fuerza':'Abre la mano completamente',300,110,34,C.tx);
  T(c,'Paso '+(this.ph+1)+' de 2',300,150,22,C.mu,'center',500);
  if(this.t<pre){const k=Math.ceil(pre-this.t);if(k!==this.ck){this.ck=k;snd('tick');if(k===4)say(this.ph?'Cierra el puño con fuerza':'Abre la mano completamente')}}if(this.t<pre)T(c,'Prepárate… '+Math.ceil(pre-this.t),300,260,60,C.wa);
  else{T(c,'¡Mantén la posición!',300,250,34,C.ok);raw.forEach((v,i)=>this.acc[i]+=v);this.n++;
   c.fillStyle=C.ln;c.fillRect(100,300,400,18);c.fillStyle=C.ok;c.fillRect(100,300,400*(this.t-pre)/2,18)}
  hand(c,690,230,1.7);
  if(this.t>=pre+2){snd('ok');this.v[this.ph]=this.acc.map(a=>a/this.n);this.acc=[0,0,0,0];this.n=0;this.t=0;if(++this.ph>1)return true}return false},
 res(){const th=mode==='demo'?20:30,bad=NAMES.filter((n,i)=>Math.abs(this.v[1][i]-this.v[0][i])<th);
  if(bad.length)return{lines:['No se detectó movimiento en: '+bad.join(', ')+'.','Revisa el sensor e inténtalo otra vez.']};
  cal={min:this.v[0],max:this.v[1],done:true};save('gr_cal_'+mode,cal);return{lines:['¡Guante calibrado! ✓']}}};
// ---------- 1. PUÑO ----------
G.fist={name:'Puño y apertura',emoji:'✊',desc:'Cierra y abre la mano siguiendo la bolita.',
 init(){this.rep=0;this.goal=P([4,6,8,10,12]);this.ph=0;this.t=0;this.b=0},
 step(dt,c){this.t+=dt;const a=avg();this.b+=(a-this.b)*.25;
  if(!this.ph&&a>P([.55,.65,.75,.85,.92])){this.ph=1;snd('in');say('Ahora ábrela suavemente')}else if(this.ph&&a<.2){this.ph=0;this.rep++;snd('rep');say(this.rep>=this.goal?'¡Excelente!':String(this.rep))}
  T(c,this.ph?'Ahora ábrela suavemente':'Cierra la mano',450,60,36,C.tx);
  const gx=120,top=110,h=340;c.fillStyle=C.ln;c.beginPath();c.roundRect(gx,top,70,h,35);c.fill();
  c.fillStyle=C.ok+'88';c.beginPath();if(this.ph)c.roundRect(gx,top+h*.8,70,h*.2,35);else c.roundRect(gx,top,70,h*.25,35);c.fill();
  T(c,'Cerrada',gx+35,top-10,16,C.mu);T(c,'Abierta',gx+35,top+h+24,16,C.mu);
  const by=top+h-35-(h-70)*this.b;orb(c,gx+35,by,30,C.pr);
  hand(c,600,190,2);
  for(let i=0;i<this.goal;i++){c.fillStyle=i<this.rep?C.ok:C.ln;c.beginPath();c.arc(330+i*34,480,12,0,7);c.fill()}
  T(c,this.rep+' / '+this.goal,300,487,22,C.tx,'right');return this.rep>=this.goal},
